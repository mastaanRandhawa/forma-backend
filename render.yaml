# Render Blueprint — one web service + a managed Postgres.
# Deploy: Render dashboard → New → Blueprint → pick this repo.
# https://render.com/docs/blueprint-spec

databases:
  - name: forma-db
    plan: free # free Postgres expires after 30 days; upgrade for anything real
    databaseName: forma
    user: forma

services:
  - type: web
    name: forma-backend
    runtime: node
    plan: free # free web services sleep after 15 min idle (cold starts)
    region: oregon # keep the DB in the same region
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: forma-db
          property: connectionString # internal URL — fast, no egress, no sslmode needed
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # the browser origin(s) of the web companion — comma-separated, no trailing slash
      - key: WEB_ORIGIN
        value: https://mastaanrandhawa.github.io
      # optional — omit for the deterministic offline fallback
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-5

  # Optional background worker (reminders, token cleanup, weekly rollups).
  # The API runs fine without it. Free plan does not include background workers —
  # uncomment on a paid plan, or skip it.
